name: AUDit data refresh

# Refreshes the AUD exchange rate and model prices for the AUDit site every morning (AEST).
on:
  schedule:
    - cron: "47 19 * * *" # 05:47 AEST / 06:47 AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh data
        run: python audit/scripts/refresh_data.py
      - name: Check data files
        run: |
          pip install -q "pytest>=8"
          python -m pytest tests/test_audit_data.py -q
      - name: Commit changes
        run: |
          if git diff --quiet -- audit/data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "audit-refresh[bot]"
          git config user.email "audit-refresh@users.noreply.github.com"
          git add audit/data
          git commit -m "Refresh AUDit prices and exchange rate"
          git push
